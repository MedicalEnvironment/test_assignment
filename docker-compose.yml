services:
  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web1
      - web2
    restart: unless-stopped
    networks:
      - app-network

  # Первый экземпляр приложения
  web1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hello-world-app-1
    environment:
      - PORT=3000
    restart: unless-stopped
    networks:
      - app-network

  # Второй экземпляр приложения
  web2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hello-world-app-2
    environment:
      - PORT=3000
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
