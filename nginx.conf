events {
    worker_connections 1024;
}

http {
    upstream backend {
        # Балансировка нагрузки между несколькими экземплярами приложения
        server web1:3000 max_fails=3 fail_timeout=30s;
        server web2:3000 max_fails=3 fail_timeout=30s;
        
        # Keep-alive connections для лучшей производительности
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Логирование
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        location / {
            # Проксирование запросов к backend
            proxy_pass http://backend;
            
            # Заголовки для корректной работы
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Keep-alive
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Retry на другой сервер при ошибке
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
        }
        
        # Health check endpoint для backend
        location /health {
            proxy_pass http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        # Healthcheck endpoint для самого Nginx
        location /nginx-health {
            access_log off;
            return 200 "Nginx is healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
